[project]
name = "theory-compiler"
version = "0.1.0"
description = "Theoria DSL compiler chain: theory.dsl/playbook.dsl → Python/Lean/PDDL/Markdown"
requires-python = ">=3.10"
dependencies = [
    "lark>=1.1",
    "pddl>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
