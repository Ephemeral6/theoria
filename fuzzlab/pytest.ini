[pytest]
# `props/` holds the seven engine property modules, not tests -- pointing
# testpaths there made a bare `pytest` in this directory collect nothing and
# exit 5.  It never showed up because verify.py passes `fuzzlab/tests`
# explicitly, which overrides testpaths; the setting only bit whoever ran
# pytest here with no arguments, which is what the merge gate does.
testpaths = tests
python_files = test_*.py
addopts = -q
filterwarnings =
    error::RuntimeWarning
